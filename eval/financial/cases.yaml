# Ground-truth figure set over the sample filing(s). Each case must resolve to
# EXACTLY the expected value (computed metrics are quantized to 0.001 by the
# compute layer, so expectations are exact too; `tolerance` is an optional
# absolute slack, default 0).
#
# To add a case: ingest the document below, state the number you can verify by
# hand against the filing, and the period it belongs to.

entity: ACME
entity_name: Acme Corp
files:
  - sample_docs/acme_corp_10q_q3_2024.html

cases:
