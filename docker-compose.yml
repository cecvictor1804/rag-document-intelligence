# Local development stack. Brings up Postgres+pgvector and the backend API.
# `docker compose up db` is enough for Phase 1 ingestion against a local DB.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      DOC_SOURCE: local
      LOCAL_DOCS_PATH: /app/sample_docs
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./sample_docs:/app/sample_docs:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
