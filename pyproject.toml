[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-intelligence"
version = "0.1.0"
description = "Internal documentation RAG: grounded, cited answers over company docs."
requires-python = ">=3.12"
dependencies = [
    # Web / config
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    # Database (Postgres + pgvector)
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # Embeddings / rerank / generation
    "anthropic>=0.40",
    "voyageai>=0.3",
    # Document loaders
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    # AWS (S3 source + SQS worker)
    "boto3>=1.34",
    # Auth (Google OIDC verification)
    "google-auth>=2.30",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[project.scripts]
rag-ingest = "ingestion.pipeline.run:main"

# Two source roots map to two top-level import packages:
#   backend/app  -> `app`        (FastAPI backend + shared core contract)
#   ingestion    -> `ingestion`  (ingestion pipeline; imports from `app.core`)
# This gives both halves one definition of the core interfaces/DTOs.
[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["app*", "ingestion*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "ingestion/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "backend"
